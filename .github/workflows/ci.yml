name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Nim ${{ matrix.nim }}, Capstone ${{ matrix.capstone }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nim: ['2.0.x', 'stable']
        capstone: ['4.0.2', '5.0.9']
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capstone 4 from the distribution
        if: startsWith(matrix.capstone, '4')
        run: sudo apt-get update && sudo apt-get install -y libcapstone-dev

      - name: Capstone 5 from source
        if: startsWith(matrix.capstone, '5')
        run: |
          curl -sSL https://github.com/capstone-engine/capstone/archive/refs/tags/${{ matrix.capstone }}.tar.gz | tar xz
          cmake -S capstone-${{ matrix.capstone }} -B capstone-build -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON -DCAPSTONE_BUILD_TESTS=OFF -DCAPSTONE_BUILD_CSTOOL=OFF \
                -DCMAKE_INSTALL_PREFIX="$HOME/capstone"
          cmake --build capstone-build -j4
          cmake --install capstone-build
          echo "PKG_CONFIG_PATH=$HOME/capstone/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/capstone/lib" >> "$GITHUB_ENV"

      - run: pkg-config --modversion capstone
      - run: nimble test -y
      - run: nimble examples

  memory:
    name: valgrind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libcapstone-dev valgrind
      - name: Tests under valgrind
        run: |
          for test in traw tapi tarch; do
            nim c --hints:off -d:useMalloc --debugger:native -o:"$RUNNER_TEMP/$test" "tests/$test.nim"
            # std/unittest keeps one "possibly lost" block of its own; only definite leaks count.
            valgrind --quiet --leak-check=full --errors-for-leak-kinds=definite,indirect \
                     --error-exitcode=1 "$RUNNER_TEMP/$test"
          done

  docs:
    name: documentation and its examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libcapstone-dev
      - run: nimble docs

  # Not verified yet: the package has only been tested on Linux and, through
  # MinGW and Wine, on Windows. This job shows where macOS stands without
  # failing the run.
  macos:
    name: macOS (experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: brew install capstone pkg-config
      - run: nimble test -y
